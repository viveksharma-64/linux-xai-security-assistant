# Continuous integration for the Linux XAI Security Assistant.
#
# Gating model
# ------------
# Every job here is a merge gate. `test` runs the full regression suite (fixed,
# not trimmed -- see the Phase B notes) with coverage across every supported
# Python; `lint` runs ruff and `types` runs mypy.
#
# `lint` and `types` were advisory (continue-on-error) through Phase B because the
# build host could not reach PyPI to install either tool, so neither had been
# baselined against the pre-existing tree and neither was allowed to block a merge
# on findings no one had triaged. That baselining is now done -- both report zero
# findings on `main` -- so continue-on-error is gone and a new finding fails the
# run. Note that failing the run is necessary but not sufficient to block a merge:
# the `ruff` and `mypy` contexts must also be listed as required status checks in
# the branch-protection rules for `main`.
#
# The `ml` job is a second required gate that exists to make one guarantee the
# `test` job cannot: that the scikit-learn-backed tests actually execute. Those
# tests skip themselves when scikit-learn is absent (`ml.training.SKLEARN_AVAILABLE`
# is False), and a skip is green -- so if scikit-learn ever failed to install, the
# `test` job would stay green while 35 tests silently vanished. scikit-learn is a
# declared runtime dependency, so `pip install -e '.[dev]'` already pulls it into
# the `test` job too; the `ml` job asserts it imported and then refuses to pass if
# any test in the scikit-learn-gated files skips. It touches only the CI config --
# no model behaviour, activation gate, threshold, or safety invariant changes here.
#
# eBPF/BCC is never installed here: the Python binding must match the running
# kernel, which a hosted runner does not provide. Every module that touches bcc
# defers the import (telemetry/bcc/bpf_runtime.py) so the suite imports cleanly
# without it. (That kernel-binding constraint is why bcc, unlike scikit-learn, is
# not a declared dependency and its handful of tests stay skipped even here.)
name: CI

on:
  push:
    branches: ["main", "phase-*"]
  pull_request:
    branches: ["main"]

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every interpreter this project *claims* to support, which is what makes
        # the `Programming Language :: Python :: 3.x` classifiers in
        # `pyproject.toml` a tested assertion rather than an aspiration. Keep the
        # two lists identical in both directions: adding a classifier without a
        # matrix entry ships an untested support claim, and dropping an entry
        # without dropping the classifier is the same bug with the evidence
        # removed. 3.14 is the development interpreter here, so its breakages are
        # hit locally either way -- gating on it means they surface as a failed
        # check on a branch instead of as a surprise on someone else's machine.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run the suite with coverage
        # Coverage is reported, not gated: a threshold is only meaningful once it
        # has been measured on a runner, and this is the first run that can.
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  ml:
    name: ml (scikit-learn required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # A single interpreter is enough: this job gates on "the scikit-learn
          # path executed", not on cross-version behaviour, which the `test`
          # matrix already covers. 3.12 matches the lint/type jobs.
          python-version: "3.12"
          cache: pip
      - name: Install (with scikit-learn)
        # scikit-learn is a declared runtime dependency, so the base install
        # pulls it in; no extra install line is needed. If the wheel ever stops
        # resolving, this step fails here rather than silently downgrading the
        # suite to skips.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Assert scikit-learn is importable
        # The gate the `test` job cannot give: prove the dependency is really
        # present before asserting the tests ran. `SKLEARN_AVAILABLE` is the exact
        # flag the tests branch on, so checking it here tests the same condition
        # they do -- not merely that some sklearn is on the path.
        run: |
          python -c "import sklearn; print('scikit-learn', sklearn.__version__)"
          python -c "from ml.training import SKLEARN_AVAILABLE; assert SKLEARN_AVAILABLE, 'ml.training could not import scikit-learn'; print('SKLEARN_AVAILABLE =', SKLEARN_AVAILABLE)"
      - name: Run the scikit-learn-gated tests, forbidding skips
        # Run the four scikit-learn-gated files by name -- fast and focused, and
        # the full suite (with these no longer skipped) still runs in `test`. `-rs`
        # prints any surviving skip reasons in the log. pytest has no native "fail
        # on skip", so a skip is still exit 0 here; the JUnit report this writes is
        # inspected by the next step, which is what actually enforces zero skips.
        #
        # test_ml_workflow_cli.py is listed here deliberately: the train -> evaluate
        # -> gate workflow it covers cannot run without scikit-learn at all, so
        # leaving it out of this job would let the one command that decides whether
        # a model may be activated go untested behind a green check.
        #
        # These four files are currently *every* scikit-learn-gated test in the
        # suite: without scikit-learn the whole suite skips 35 tests and these four
        # files account for all 35. If a fifth file ever gains a SKLEARN_AVAILABLE
        # skip, add it here -- the `test` job will not notice it vanishing.
        run: |
          pytest tests/test_ml_artifact.py tests/test_ml_attribution.py tests/test_ml_integration.py \
            tests/test_ml_workflow_cli.py -rs --junit-xml=ml-junit.xml
      - name: Fail if any scikit-learn-gated test skipped
        # A skip here means scikit-learn was not exercised despite being declared
        # -- exactly the silent-green regression this job exists to catch. Parse
        # the JUnit report and require zero skips (and zero errors/failures).
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("ml-junit.xml").getroot()
          suites = root.findall(".//testsuite")
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failures = sum(int(s.get("failures", 0)) for s in suites)
          errors = sum(int(s.get("errors", 0)) for s in suites)
          total = sum(int(s.get("tests", 0)) for s in suites)
          print(f"collected={total} skipped={skipped} failures={failures} errors={errors}")
          if skipped:
              names = [
                  tc.get("classname", "") + "::" + tc.get("name", "")
                  for s in suites for tc in s.findall("testcase")
                  if tc.find("skipped") is not None
              ]
              print("SKIPPED (scikit-learn not exercised):", *names, sep="\n  ")
              sys.exit(1)
          if failures or errors:
              sys.exit(1)
          print("OK: every scikit-learn-gated test executed")
          PY
      - name: Upload ML JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-junit
          path: ml-junit.xml
          if-no-files-found: ignore

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .

  types:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      # Scoped to the Phase B modules: the value is a clean type story for the new
      # supervision, retention, config, metrics, and auth code, not a repo-wide
      # retrofit. Widen this list as other packages are annotated.
      - run: mypy observability pipeline/service.py pipeline/quarantine.py pipeline/supervisor.py storage/retention.py api/auth.py
