# Continuous integration for the Linux XAI Security Assistant.
#
# Gating model
# ------------
# The `test` job is the merge gate: it runs the full regression suite (fixed, not
# trimmed -- see the Phase B notes) with coverage across every supported Python.
# `lint` and `ruff` and `types` run alongside but are advisory (continue-on-error):
# the build host used during Phase B could not reach PyPI to install ruff or mypy,
# so those tools have not yet been baselined against the pre-existing tree and are
# not allowed to block a merge on findings no one has triaged. They still run on
# every push so the findings are visible and can be driven to zero, at which point
# flipping them to required is a one-line change.
#
# eBPF/BCC is never installed here: the Python binding must match the running
# kernel, which a hosted runner does not provide. Every module that touches bcc
# defers the import (telemetry/bcc/bpf_runtime.py) so the suite imports cleanly
# without it.
name: CI

on:
  push:
    branches: ["main", "phase-*"]
  pull_request:
    branches: ["main"]

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run the suite with coverage
        # Coverage is reported, not gated: a threshold is only meaningful once it
        # has been measured on a runner, and this is the first run that can.
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  lint:
    name: ruff (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .

  types:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      # Scoped to the Phase B modules: the value is a clean type story for the new
      # supervision, retention, config, metrics, and auth code, not a repo-wide
      # retrofit. Widen this list as other packages are annotated.
      - run: mypy observability pipeline/service.py pipeline/quarantine.py pipeline/supervisor.py storage/retention.py api/auth.py
