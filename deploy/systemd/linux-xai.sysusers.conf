# A single system user shared by both services.
#
# Shared rather than one-per-service (or DynamicUser=) on purpose: the ingestion
# service writes the evidence database at mode 0600 and the API service must read
# it, so they have to resolve to the same UID. A DynamicUser would give each a
# different transient UID and the 0600 database would be unreadable across the
# pair.
#
# Install: systemd-sysusers deploy/systemd/linux-xai.sysusers.conf
#   (or copy to /usr/lib/sysusers.d/linux-xai.conf for the packaged path)
u linux-xai - "Linux XAI Security Assistant" /var/lib/linux-xai-security -
