#
# Packaging and tooling configuration for the Linux XAI Security Assistant.
#
# Versioning scheme
# -----------------
#   0.9.x  Feature-complete demonstrator undergoing production hardening.
#   1.0.0  Reserved for the completion of the production roadmap (through the
#          analyst-experience phase): supervised ingestion with no silent event
#          loss, migrated schema, authenticated API, measured detection efficacy.
#
# Installation
# ------------
#   python3 -m venv .venv && . .venv/bin/activate
#   pip install -e '.[dev]'
#
# BCC/eBPF is deliberately NOT a declared dependency. The Python binding must
# match the running kernel and libbcc, so it is installed from Kali packages:
#   sudo apt install -y bpfcc-tools python3-bpfcc libbpfcc libbpfcc-dev
# See README.md and scripts/verify_environment.sh.
#
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-xai-security-assistant"
version = "0.9.0"
description = "Explainable, read-only Linux kernel-level intrusion and behavioral threat detection"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vivek Kumar Sharma" }]
keywords = [
    "security",
    "ebpf",
    "linux",
    "intrusion-detection",
    "explainable-ai",
    "threat-detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]

# Runtime API, policy, and ML dependencies. Kept in lockstep with
# requirements.txt, which remains the supported non-editable install path.
dependencies = [
    "fastapi>=0.135,<0.136",
    "uvicorn>=0.38,<0.39",
    "pydantic>=2.13,<3",
    "PyYAML>=6.0,<7",
    "psutil>=7.1,<8",
    "numpy>=2.4,<3",
    "scikit-learn>=1.9,<2",
]

[project.optional-dependencies]
# Test and CI tooling. Kept deliberately small: every addition here is a
# dependency an offline Kali host must be able to satisfy. `httpx` is the
# transport Starlette's TestClient uses; it is declared so the API tests import
# on a clean checkout rather than only where FastAPI happened to pull it in.
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=5,<8",
    "httpx>=0.28,<0.29",
    "ruff>=0.6,<0.15",
    "mypy>=1.11,<2",
    "types-PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/vivek-kumar-sharma/linux-xai-security-assistant"

[project.scripts]
# Read-only API and dashboard host. Refuses non-loopback binds unless
# ALLOW_NON_LOOPBACK_API=1 is set explicitly; see api/__main__.py.
linux-xai-api = "api.__main__:main"
# Supervised bounded ingestion service.
linux-xai-ingest = "pipeline.live_ingestion:main"
# Unattended supervised daemon: multi-collector supervision with restart backoff
# and crash-loop degradation, in-process retention, and transition-only alerting.
# This is the entrypoint the packaged systemd unit runs; see deploy/systemd/.
linux-xai-service = "pipeline.service:main"

[tool.setuptools]
# Explicit package list. Auto-discovery is not used because the repository root
# also holds non-package directories (docs, scripts, tests, dashboard, ml/models).
packages = [
    "api",
    "assistant",
    "baseline",
    "detection",
    "explainability",
    "ml",
    "observability",
    "pipeline",
    "policy",
    "storage",
    "telemetry",
    "telemetry.auditd",
    "telemetry.bcc",
    "telemetry.journald",
]

[tool.setuptools.package-data]
policy = ["*.yaml"]

[tool.pytest.ini_options]
# `pythonpath` removes the previously load-bearing requirement to invoke the
# suite as `PYTHONPATH=. python3 -m pytest`. Bare `pytest` now works, which is
# what CI and new contributors will reach for first.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = [
    # Show everything by default. Python silences ResourceWarning out of the box;
    # un-silencing it is what surfaced ~113 unclosed SQLite connections in
    # storage/sqlite_store.py and the leaked collector pipes in
    # pipeline/live_ingestion.py. Later entries take precedence.
    #
    # Deliberately NOT "error::ResourceWarning": ResourceWarning is raised during
    # finalization, so the exception cannot propagate and pytest never fails on
    # it -- Python just prints "Exception ignored while finalizing". Leaks are
    # enforced instead by tests/test_resource_lifetime.py, which counts open file
    # descriptors directly and does not depend on GC timing.
    "default",
    # BCC's ctypes Structures trigger an implicit-_layout_ deprecation on
    # Python 3.14. It originates in /usr/lib/python3/dist-packages/bcc and is
    # not actionable from this repository.
    "ignore:Due to '_pack_'.*:DeprecationWarning",
]
# The API-authentication tests opt the gate back on with this marker; conftest
# turns auth off for every other test because they predate it.
markers = [
    "api_auth: exercise the API with authentication enabled",
]

[tool.ruff]
# Advisory in CI (see .github/workflows/ci.yml): the linter is not installable on
# the offline build host, so it cannot be a merge gate until a maintainer with it
# installed has baselined the pre-existing tree. Config lives here so `ruff check`
# is uniform wherever it does run.
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "ml/models", "dashboard"]

[tool.ruff.lint]
# E/F/W: pyflakes + pycodestyle. I: import order. B: bugbear. UP: pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]
# E501 (line length) is reported, not enforced: several config tables are wide by
# design and reflowing them would hurt readability more than it helps.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests bind fixtures and construct objects for their side effects.
"tests/*" = ["B011"]

[tool.mypy]
# Advisory in CI, same reason as ruff. Scoped and lenient on purpose: this is a
# large tree that was not written against a type checker, so the value here is
# catching regressions in the Phase B modules, not retrofitting annotations
# everywhere at once.
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = true

[tool.coverage.run]
branch = true
source = [
    "api",
    "observability",
    "pipeline",
    "storage",
]
# eBPF probes need a live kernel and libbcc, so they never execute under CI and
# would only dilute the percentage with unreachable lines.
omit = ["telemetry/bcc/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
